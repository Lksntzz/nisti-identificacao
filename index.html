<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta id="nisti-viewport" name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const isAdmin = window.location.pathname.startsWith('/admin');
      if (!isAdmin || params.get('desktop') !== '1') return;
      const viewport = document.getElementById('nisti-viewport');
      if (!viewport) return;
      const screenWidth = Math.max(320, Math.min(Number(window.screen?.width) || 390, 600));
      const scale = Math.max(0.22, Math.min(1, screenWidth / 1440));
      viewport.setAttribute(
        'content',
        `width=1440,initial-scale=${scale.toFixed(3)},minimum-scale=${Math.max(0.18, scale * 0.8).toFixed(3)},maximum-scale=3,user-scalable=yes,viewport-fit=cover`
      );
      document.documentElement.dataset.nistiDesktopPreview = '1';
    })();
  </script>
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0B1329" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NISTI ID" />
  <title>NISTI ID · Identificação Visual</title>
  <meta name="description" content="NISTI ID - Sistema de Identificação Visual e Reconhecimento de Livros e Produtos" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/nisti-logo.png" />
  <link rel="apple-touch-icon" href="/nisti-logo.png" />
  <link rel="preload" as="image" href="/nisti-logo.png" />
</head>
