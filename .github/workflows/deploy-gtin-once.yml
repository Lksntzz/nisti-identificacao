name: Deploy EAN dismissal once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-gtin-once.yml

permissions:
  contents: read

concurrency:
  group: nisti-identificacao-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'ops: deploy descarte EAN em produção'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx wrangler d1 migrations apply nisti-identificacao --local
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
