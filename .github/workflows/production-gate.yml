name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies for high findings
        run: npm audit --audit-level=high
      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply nisti-identificacao --local --config wrangler.d1-compat.toml
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  # GA-019: testes do banco (commit de vendas por dia) num PostgreSQL 17 LOCAL e DESCARTÁVEL, só dentro do runner.
  # Grátis: não usa Supabase, nem Branching, nem serviço pago; nunca toca dados reais. As dependências ficam em
  # test/db/package.json (lockfile próprio), então o build e o deploy de produção não baixam nada a mais.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies (root)
        run: npm ci --no-audit --no-fund
      - name: Install database test dependencies
        run: npm run test:db:install
      - name: Run database tests (disposable PostgreSQL)
        run: npm run test:db
