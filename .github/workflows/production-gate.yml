name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply nisti-identificacao --local
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
