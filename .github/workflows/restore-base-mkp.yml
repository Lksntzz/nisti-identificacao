name: Restore Base MKP Binary
on:
  push:
    branches: [fix/mkp-v15-wireo-routing]
    paths: [.github/workflows/restore-base-mkp.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mkp-v15-wireo-routing
          fetch-depth: 0
      - run: |
          git fetch origin main
          git checkout origin/main -- public/product-masks-mkp/wire_branco_com_tassel.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/product-masks-mkp/wire_branco_com_tassel.png
          git diff --cached --quiet && exit 0
          git commit -m "Restore base white-wire tassel asset"
          git push origin HEAD:fix/mkp-v15-wireo-routing
