name: Export NISTI Product Images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-product-images.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download current product images from R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
          R2_BUCKET: nisti-identificacao-images
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET"
          mkdir -p nisti_product_images
          curl --fail --silent --show-error --location -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/objects?prefix=products%2F&per_page=1000" -o objects.json
          count="$(jq '.result | length' objects.json)"
          truncated="$(jq -r '.result_info.is_truncated // false' objects.json)"
          echo "R2 product images: $count; truncated: $truncated"
          test "$truncated" = "false"
          test "$count" -gt 0

          jq -r '.result[] | [.key, (.http_metadata.contentType // "application/octet-stream")] | @tsv' objects.json |
          while IFS=$'\t' read -r key mime; do
            id="$(cut -d/ -f2 <<<"$key")"
            case "$mime" in
              image/jpeg*) ext="jpg" ;;
              image/png*) ext="png" ;;
              image/webp*) ext="webp" ;;
              image/gif*) ext="gif" ;;
              *) ext="img" ;;
            esac
            encoded_key="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$key")"
            out="nisti_product_images/PRODUTO_ID${id}.${ext}"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/objects/$encoded_key" -o "$out"
          done

          downloaded="$(find nisti_product_images -type f | wc -l | tr -d ' ')"
          bytes="$(du -sb nisti_product_images | cut -f1)"
          echo "Downloaded: $downloaded images; bytes: $bytes"
          test "$downloaded" -eq "$count"
          test "$downloaded" -eq 294

      - name: Upload image ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NISTI_IMAGENS_DO_SISTEMA
          path: nisti_product_images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
