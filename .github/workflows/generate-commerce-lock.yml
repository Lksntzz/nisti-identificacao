name: Generate Commerce Lockfile

on:
  push:
    branches:
      - feat/catalogo-comercial-v1
    paths:
      - '.github/workflows/generate-commerce-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/catalogo-comercial-v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate pinned lockfile
        run: npm install --save-exact read-excel-file@9.3.10 --ignore-scripts --no-audit --no-fund
      - name: Commit package files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: pin read-excel-file 9.3.10"
          git push origin HEAD:feat/catalogo-comercial-v1
