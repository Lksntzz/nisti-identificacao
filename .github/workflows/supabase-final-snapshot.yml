name: Supabase Final Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.cutover/run-snapshot.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: nisti-supabase-final-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Export frozen D1 snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify cutover freeze config
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SUPABASE_CUTOVER_WRITE_FREEZE = "1"' wrangler.toml
          grep -q 'SUPABASE_READS_ENABLED = "0"' wrangler.toml
          grep -q 'SUPABASE_WRITE_MODE = "mirror"' wrangler.toml

      - name: Export frozen D1 snapshot
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
        run: |
          set -euo pipefail
          OUT="migration-export/final"
          mkdir -p "$OUT"

          npx wrangler d1 export nisti-identificacao --remote --no-data --output "$OUT/d1-schema.sql"
          npx wrangler d1 export nisti-identificacao --remote --no-schema --output "$OUT/d1-data.sql"

          test -s "$OUT/d1-schema.sql"
          test -s "$OUT/d1-data.sql"
          sha256sum "$OUT/d1-data.sql" "$OUT/d1-schema.sql" > "$OUT/sha256.txt"

      - name: Upload frozen snapshot artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nisti-d1-frozen-snapshot
          path: migration-export/final/
          if-no-files-found: error
          retention-days: 7
