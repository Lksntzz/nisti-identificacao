name: Repair MKP White Tassel Mask
on:
  push:
    branches: [fix/mkp-v15-wireo-routing]
    paths: [.github/workflows/repair-mkp-white-tassel.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mkp-v15-wireo-routing
      - name: Restore exact PNG from validated source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib, struct
          data=base64.b64decode("")
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack(">II",data[16:24]) == (1200,1200)
          pathlib.Path("public/product-masks-mkp/wire_branco_com_tassel.png").write_bytes(data)
          PY
      - name: Commit repaired binary
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/product-masks-mkp/wire_branco_com_tassel.png
          git diff --cached --quiet && exit 0
          git commit -m "Repair white-wire tassel MKP mask binary"
          git push origin HEAD:fix/mkp-v15-wireo-routing
