name: One-time NISTI Commerce Backfill

on:
  push:
    branches: [ops/backfill-nisti-commerce-270]

permissions:
  contents: read

concurrency:
  group: nisti-identificacao-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy one-time backfill build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy nisti-identificacao
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05

      - name: Run NISTI to Commerce backfill
        run: |
          curl --fail-with-body --silent --show-error \
            https://nisti-identificacao.lksntz1411.workers.dev/__ops/backfill-nisti-commerce-270-8f3a1d7c2b4e
