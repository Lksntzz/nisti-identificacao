name: Commerce Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commerce-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.head_ref == 'feat/catalogo-comercial-v1' || github.head_ref == 'feat/commerce-management'
    name: Test, build and upload Worker preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply nisti-identificacao --local

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload preview version without production deployment
        run: npx wrangler versions upload --config wrangler.preview.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
