name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nisti-identificacao-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply nisti-identificacao --local

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy nisti-identificacao
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
