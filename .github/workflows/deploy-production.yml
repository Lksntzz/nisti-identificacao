name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nisti-identificacao-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply nisti-identificacao --local --config wrangler.d1-compat.toml

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Detect D1 migration changes
        id: d1_changes
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD -- 'migrations/*.sql' | grep -q .; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "D1 migrations changed in this deploy."
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No D1 migration changed; remote D1 migration step will be skipped."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Previous commit unavailable; fail safe by requiring D1 migration check."
          fi

      - name: Apply D1 migrations to production
        if: steps.d1_changes.outputs.changed == 'true'
        run: npx wrangler d1 migrations apply nisti-identificacao --remote --config wrangler.d1-compat.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05

      - name: Deploy nisti-identificacao
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
