name: Export Original Product Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-original-product-images.yml
      - scripts/export-original-product-images.mjs

permissions:
  contents: read

jobs:
  export:
    name: Export originals from R2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Read original image index from D1
        run: |
          mkdir -p export
          npx wrangler d1 execute nisti-identificacao --remote --json \
            --command="SELECT id, sku, image_key FROM products WHERE image_key IS NOT NULL ORDER BY id" \
            > export/products.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05

      - name: Download original objects from R2
        run: node scripts/export-original-product-images.mjs export/products.json export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05

      - name: Create ZIP
        if: always()
        run: |
          cd export
          zip -q -r nisti-imagens-originais.zip original-images manifest.csv export-summary.json

      - name: Upload ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nisti-imagens-originais-${{ github.run_id }}
          path: export/nisti-imagens-originais.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Verify complete export
        if: always()
        run: |
          node -e "const s=require('./export/export-summary.json'); if(s.failed) { console.error(s); process.exit(1) } console.log(s)"
