name: Export Original Product Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-original-product-images.yml
      - scripts/export-original-product-images.mjs

permissions:
  contents: read

jobs:
  export:
    name: Export originals from R2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Read original image index from D1
        run: |
          mkdir -p export
          npx wrangler d1 execute nisti-identificacao --remote --json \
            --command="SELECT id, sku, image_key FROM products WHERE image_key IS NOT NULL ORDER BY id" \
            > export/products.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05

      - name: Download original objects from R2
        run: node scripts/export-original-product-images.mjs export/products.json export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05

      - name: Create ZIP
        if: always()
        run: |
          cd export
          zip -q -r nisti-imagens-originais.zip original-images manifest.csv export-summary.json failures.txt

      - name: Upload ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nisti-imagens-originais-${{ github.run_id }}
          path: export/nisti-imagens-originais.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish export report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const s = JSON.parse(fs.readFileSync('./export/export-summary.json', 'utf8'));
          if (!Number.isInteger(s.total) || !Number.isInteger(s.exported) || !Number.isInteger(s.failed)) {
            throw new Error('Resumo de exportação inválido.');
          }
          const message = `Exportação concluída: ${s.exported}/${s.total} originais disponíveis; ausentes no R2: ${s.failed}.`;
          if (s.failed > 0) {
            console.warn(`Aviso: ${message}`);
            console.warn('Os itens ausentes permanecem listados em export/failures.txt; nenhuma imagem tratada foi substituída.');
          } else {
            console.log(message);
          }
          const summary = [
            '### Exportação de originais',
            '',
            message,
            '',
            '- O relatório de ausências está em \`failures.txt\`.',
            '- Imagens tratadas não são alteradas por este workflow.'
          ].join('\\n') + '\\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
