name: Export Original Product Images

# Execução somente manual: exportações de imagens produzem artefatos sensíveis.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export originals from R2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify required secrets
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NISTI_IMAGE_EXPORT_PASSPHRASE: ${{ secrets.NISTI_IMAGE_EXPORT_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY}" || -z "${CLOUDFLARE_API_TOKEN}" || ${#NISTI_IMAGE_EXPORT_PASSPHRASE} -lt 20 ]]; then
            echo "::error::Configure os Secrets protegidos do Supabase, R2 e senha de exportação (20+ caracteres)."
            exit 1
          fi

      - name: Read original image index from Supabase (primary)
        run: node scripts/export-original-image-index-supabase.mjs export/products.json
        env:
          SUPABASE_URL: https://yioetdcbgorunwgwuawg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Download original objects from R2
        run: node scripts/export-original-product-images.mjs export/products.json export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05

      - name: Create ZIP
        run: |
          cd export
          zip -q -r nisti-imagens-originais.zip original-images manifest.csv export-summary.json failures.txt

      - name: Encrypt ZIP before upload
        run: node scripts/nisti-encrypt-image-export.mjs encrypt export/nisti-imagens-originais.zip export/nisti-imagens-originais.zip.nisti.enc
        env:
          NISTI_IMAGE_EXPORT_PASSPHRASE: ${{ secrets.NISTI_IMAGE_EXPORT_PASSPHRASE }}

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nisti-imagens-originais-criptografadas-${{ github.run_id }}
          path: export/nisti-imagens-originais.zip.nisti.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish export report
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const s = JSON.parse(fs.readFileSync('./export/export-summary.json', 'utf8'));
          if (!Number.isInteger(s.total) || !Number.isInteger(s.exported) || !Number.isInteger(s.failed)) {
            throw new Error('Resumo de exportação inválido.');
          }
          const message = `Exportação concluída: ${s.exported}/${s.total} originais disponíveis; ausentes no R2: ${s.failed}.`;
          if (s.failed > 0) {
            console.warn(`Aviso: ${message}`);
            console.warn('Os itens ausentes permanecem listados em export/failures.txt; nenhuma imagem tratada foi substituída.');
            process.exitCode = 1; // Exportação parcial não é backup válido.
          } else {
            console.log(message);
          }
          const summary = [
            '### Exportação de originais',
            '',
            message,
            '',
            '- O relatório de ausências está em \`failures.txt\`.',
            '- Imagens tratadas não são alteradas por este workflow.',
            '- O artefato ZIP é disponibilizado apenas criptografado (AES-256-GCM).'
          ].join('\\n') + '\\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
