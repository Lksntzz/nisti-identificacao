name: Debug Mural Cutout Samples

on:
  push:
    branches: [debug/mural-cutout-samples]
    paths:
      - .github/workflows/debug-mural-cutout-samples.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/mural-cutout-samples
      - name: Download exact R2 samples
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/nisti-identificacao-images/objects"
          mkdir -p debug-mural-images
          get() {
            key="$1"; out="$2"
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")"
            curl --fail --silent --show-error --location -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$encoded" -o "$out"
          }
          get "products/1/354bc8e4-3e59-4287-92bc-83b371080c64" "debug-mural-images/id1-original.jpg"
          get "processed/products/1/f63e6be2-4db4-44f6-9cb6-8c1d3b4aad64.png" "debug-mural-images/id1-treated.png"
          get "products/2/388c5780-3813-45d8-ad12-8afb0a671af4" "debug-mural-images/id2-original.jpg"
          get "processed/products/2/bc11cf88-01dc-4f7e-af0d-76934b1676cd.png" "debug-mural-images/id2-treated.png"
          get "products/176/caa858f6-a636-4433-8437-c20786291a72" "debug-mural-images/id176-original.jpg"
          get "processed/products/176/3801783f-750a-4e9a-b73d-ce136b876b9d.png" "debug-mural-images/id176-treated.png"
          file debug-mural-images/*
      - name: Commit samples to debug branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-mural-images
          git commit -m "Add temporary Mural cutout samples"
          git push origin HEAD:debug/mural-cutout-samples
