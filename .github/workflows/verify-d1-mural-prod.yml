name: Inspect D1 Drift

on:
  push:
    branches: [verify/d1-mural-prod]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Inspect remote migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
        run: |
          npx wrangler d1 execute nisti-identificacao --remote --command "PRAGMA table_info(gtin_scan_events);"
          npx wrangler d1 execute nisti-identificacao --remote --command "SELECT name FROM sqlite_master WHERE name='idx_gtin_scan_events_pending';"
          npx wrangler d1 execute nisti-identificacao --remote --command "SELECT id,name,applied_at FROM d1_migrations ORDER BY id DESC LIMIT 10;"
          npx wrangler d1 migrations list nisti-identificacao --remote
