name: Inspect Mural QA Product Candidates

on:
  push:
    branches: [verify/d1-mural-prod]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: List QA product candidates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
        run: |
          npx wrangler d1 execute nisti-identificacao --remote --command "SELECT id,sku,nome,variacao,CASE WHEN image_key IS NULL OR image_key='' THEN 0 ELSE 1 END AS has_image FROM products ORDER BY has_image DESC,id DESC LIMIT 12;"
          npx wrangler d1 execute nisti-identificacao --remote --command "SELECT COUNT(*) AS mural_posts FROM mural_posts; SELECT COUNT(*) AS mural_collections FROM mural_collections;"
