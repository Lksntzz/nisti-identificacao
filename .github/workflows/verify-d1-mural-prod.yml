name: Reconcile and Verify D1 Mural Production

on:
  push:
    branches: [verify/d1-mural-prod]

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile drift and apply Mural migration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Inspect existing 0018 schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
        run: |
          set -euo pipefail
          npx wrangler d1 execute nisti-identificacao --remote --json --command "PRAGMA table_info(gtin_scan_events);" > /tmp/gtin-columns.json
          npx wrangler d1 execute nisti-identificacao --remote --json --command "PRAGMA index_info(idx_gtin_scan_events_pending);" > /tmp/gtin-index.json
          npx wrangler d1 execute nisti-identificacao --remote --json --command "PRAGMA table_info(d1_migrations);" > /tmp/migrations-table.json
          npx wrangler d1 execute nisti-identificacao --remote --json --command "SELECT name FROM d1_migrations WHERE name='0018_gtin_scan_event_dismissal.sql';" > /tmp/0018-record.json

      - name: Assert 0018 already exists structurally
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function rows(path){
            const data=JSON.parse(fs.readFileSync(path,'utf8'));
            const out=[];
            const visit=v=>{
              if(Array.isArray(v)) return v.forEach(visit);
              if(!v||typeof v!=='object') return;
              if(Array.isArray(v.results)) out.push(...v.results);
              for(const [k,c] of Object.entries(v)) if(k!=='results') visit(c);
            };
            visit(data);
            return out;
          }
          const columns=rows('/tmp/gtin-columns.json');
          const index=rows('/tmp/gtin-index.json');
          const migrationTable=rows('/tmp/migrations-table.json');
          const record=rows('/tmp/0018-record.json');

          const columnNames=new Set(columns.map(r=>r.name));
          const indexNames=index.map(r=>r.name);
          const migrationColumns=new Set(migrationTable.map(r=>r.name));

          console.log(JSON.stringify({
            gtin_columns:[...columnNames],
            pending_index_columns:indexNames,
            d1_migrations_columns:[...migrationColumns],
            migration_0018_recorded:record.some(r=>r.name==='0018_gtin_scan_event_dismissal.sql')
          },null,2));

          if(!columnNames.has('dismissed_at')||!columnNames.has('dismissed_by')){
            throw new Error('Cannot reconcile 0018: dismissal columns are not both present.');
          }
          if(indexNames.join(',')!=='status,dismissed_at,id'){
            throw new Error('Cannot reconcile 0018: pending index shape does not match the migration.');
          }
          if(!migrationColumns.has('id')||!migrationColumns.has('name')||!migrationColumns.has('applied_at')){
            throw new Error('Cannot reconcile 0018: unexpected d1_migrations schema.');
          }
          NODE

      - name: Reconcile 0018 migration history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
        run: |
          npx wrangler d1 execute nisti-identificacao --remote --command "INSERT INTO d1_migrations(name,applied_at) SELECT '0018_gtin_scan_event_dismissal.sql',CURRENT_TIMESTAMP WHERE NOT EXISTS (SELECT 1 FROM d1_migrations WHERE name='0018_gtin_scan_event_dismissal.sql');"

      - name: Apply remaining migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
        run: npx wrangler d1 migrations apply nisti-identificacao --remote

      - name: Verify remote Mural schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c36bf07704c2dc29e76e03539127ba05
        run: |
          set -euo pipefail
          npx wrangler d1 execute nisti-identificacao --remote --json --command "SELECT type,name FROM sqlite_master WHERE name IN ('d1_migrations','mural_collections','mural_collection_products','mural_posts','mural_post_reads','idx_mural_posts_feed','idx_mural_posts_kind_date','idx_mural_posts_product_id','idx_mural_posts_collection_id','idx_mural_reads_user','idx_mural_collection_products_product_id','idx_mural_collection_products_order') ORDER BY type,name;" > /tmp/mural-schema.json
          npx wrangler d1 execute nisti-identificacao --remote --json --command "SELECT id,name,applied_at FROM d1_migrations WHERE name IN ('0016_pb27_madeira_product_gtins.sql','0017_gtin_scan_events.sql','0018_gtin_scan_event_dismissal.sql','0019_mural_nisti.sql') ORDER BY id;" > /tmp/mural-migrations.json
          npx wrangler d1 execute nisti-identificacao --remote --json --command "PRAGMA table_info(mural_posts);" > /tmp/mural-post-columns.json
          npx wrangler d1 execute nisti-identificacao --remote --json --command "PRAGMA foreign_key_list(mural_posts);" > /tmp/mural-post-fks.json

      - name: Assert remote Mural migration
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function rows(path){
            const data=JSON.parse(fs.readFileSync(path,'utf8'));
            const out=[];
            const visit=v=>{
              if(Array.isArray(v)) return v.forEach(visit);
              if(!v||typeof v!=='object') return;
              if(Array.isArray(v.results)) out.push(...v.results);
              for(const [k,c] of Object.entries(v)) if(k!=='results') visit(c);
            };
            visit(data);
            return out;
          }

          const schema=rows('/tmp/mural-schema.json');
          const migrations=rows('/tmp/mural-migrations.json');
          const columns=rows('/tmp/mural-post-columns.json');
          const fks=rows('/tmp/mural-post-fks.json');

          const names=new Set(schema.map(r=>r.name));
          const migrationNames=new Set(migrations.map(r=>r.name));
          const columnNames=new Set(columns.map(r=>r.name));
          const fkTargets=new Set(fks.map(r=>r.table));

          const requiredMigrations=[
            '0016_pb27_madeira_product_gtins.sql',
            '0017_gtin_scan_events.sql',
            '0018_gtin_scan_event_dismissal.sql',
            '0019_mural_nisti.sql'
          ];
          const requiredObjects=[
            'mural_collections','mural_collection_products','mural_posts','mural_post_reads',
            'idx_mural_posts_feed','idx_mural_posts_kind_date','idx_mural_posts_product_id',
            'idx_mural_posts_collection_id','idx_mural_reads_user',
            'idx_mural_collection_products_product_id','idx_mural_collection_products_order'
          ];
          const requiredColumns=[
            'id','kind','status','title','subtitle','body','badge','badge_tone','image_key',
            'product_id','collection_id','notice_level','featured','priority','published_at',
            'expires_at','created_by','created_at','updated_at'
          ];

          const missingMigrations=requiredMigrations.filter(x=>!migrationNames.has(x));
          const missingObjects=requiredObjects.filter(x=>!names.has(x));
          const missingColumns=requiredColumns.filter(x=>!columnNames.has(x));

          const summary={
            migrations:migrations.map(r=>({id:r.id,name:r.name,applied_at:r.applied_at})),
            objects_found:requiredObjects.filter(x=>names.has(x)),
            mural_posts_columns_found:requiredColumns.filter(x=>columnNames.has(x)),
            mural_posts_fk_targets:[...fkTargets].sort()
          };
          console.log('Production D1 Mural verification');
          console.log(JSON.stringify(summary,null,2));

          if(missingMigrations.length) throw new Error('Missing migrations: '+missingMigrations.join(', '));
          if(missingObjects.length) throw new Error('Missing schema objects: '+missingObjects.join(', '));
          if(missingColumns.length) throw new Error('Missing mural_posts columns: '+missingColumns.join(', '));
          if(!fkTargets.has('products')||!fkTargets.has('mural_collections')){
            throw new Error('mural_posts foreign keys are incomplete.');
          }
          NODE
