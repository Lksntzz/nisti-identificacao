<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <defs>
    <filter id="floral-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-2" dy="5" stdDeviation="5" flood-color="#451a03" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Notebook 3 (Back left, tilted -8deg) -->
  <g transform="translate(45, 25) rotate(-8)" filter="url(#floral-shadow)">
    <rect x="0" y="0" width="95" height="135" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
    <g fill="#c99738">
      <rect x="-4" y="10" width="8" height="3" rx="1.5"/><rect x="-4" y="24" width="8" height="3" rx="1.5"/><rect x="-4" y="38" width="8" height="3" rx="1.5"/><rect x="-4" y="52" width="8" height="3" rx="1.5"/><rect x="-4" y="66" width="8" height="3" rx="1.5"/><rect x="-4" y="80" width="8" height="3" rx="1.5"/><rect x="-4" y="94" width="8" height="3" rx="1.5"/><rect x="-4" y="108" width="8" height="3" rx="1.5"/><rect x="-4" y="122" width="8" height="3" rx="1.5"/>
    </g>
    <circle cx="48" cy="65" r="22" fill="#f59e0b" opacity="0.6"/>
    <text x="48" y="105" font-family="sans-serif" font-size="8" font-weight="900" fill="#92400e" text-anchor="middle">FLORAL</text>
  </g>

  <!-- Notebook 2 (Back right, tilted 6deg) -->
  <g transform="translate(130, 20) rotate(6)" filter="url(#floral-shadow)">
    <rect x="0" y="0" width="105" height="145" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
    <g fill="#c99738">
      <rect x="-4" y="10" width="8" height="3" rx="1.5"/><rect x="-4" y="25" width="8" height="3" rx="1.5"/><rect x="-4" y="40" width="8" height="3" rx="1.5"/><rect x="-4" y="55" width="8" height="3" rx="1.5"/><rect x="-4" y="70" width="8" height="3" rx="1.5"/><rect x="-4" y="85" width="8" height="3" rx="1.5"/><rect x="-4" y="100" width="8" height="3" rx="1.5"/><rect x="-4" y="115" width="8" height="3" rx="1.5"/><rect x="-4" y="130" width="8" height="3" rx="1.5"/>
    </g>
    <circle cx="54" cy="70" r="26" fill="#10b981" opacity="0.5"/>
    <circle cx="54" cy="70" r="8" fill="#fef08a"/>
    <text x="54" y="115" font-family="sans-serif" font-size="9" font-weight="900" fill="#166534" text-anchor="middle">2027</text>
  </g>

  <!-- Notebook 1 (Front center, straight) -->
  <g transform="translate(85, 35)" filter="url(#floral-shadow)">
    <rect x="0" y="0" width="105" height="150" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <g fill="#c99738">
      <rect x="-4" y="12" width="9" height="3.5" rx="1.7"/><rect x="-4" y="28" width="9" height="3.5" rx="1.7"/><rect x="-4" y="44" width="9" height="3.5" rx="1.7"/><rect x="-4" y="60" width="9" height="3.5" rx="1.7"/><rect x="-4" y="76" width="9" height="3.5" rx="1.7"/><rect x="-4" y="92" width="9" height="3.5" rx="1.7"/><rect x="-4" y="108" width="9" height="3.5" rx="1.7"/><rect x="-4" y="124" width="9" height="3.5" rx="1.7"/><rect x="-4" y="138" width="9" height="3.5" rx="1.7"/>
    </g>
    <!-- Colorful florals -->
    <circle cx="45" cy="55" r="20" fill="#f43f5e" opacity="0.6"/>
    <circle cx="70" cy="70" r="22" fill="#fbbf24" opacity="0.6"/>
    <circle cx="45" cy="85" r="18" fill="#38bdf8" opacity="0.6"/>
    <rect x="22" y="96" width="62" height="24" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="53" y="108" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#92400e" text-anchor="middle">FLORAL</text>
    <text x="53" y="117" font-family="sans-serif" font-size="6.5" font-weight="600" fill="#b45309" text-anchor="middle">2027</text>
  </g>
</svg>
