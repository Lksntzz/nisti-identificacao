<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <defs>
    <filter id="catstack-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-2" dy="5" stdDeviation="5" flood-color="#881337" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Notebook 3 (Back left, tilted -8deg) -->
  <g transform="translate(45, 25) rotate(-8)" filter="url(#catstack-shadow)">
    <rect x="0" y="0" width="95" height="135" rx="8" fill="#ffe4e6" stroke="#fbcfe8" stroke-width="1.5"/>
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7">
      <rect x="-4" y="10" width="8" height="3" rx="1.5"/><rect x="-4" y="24" width="8" height="3" rx="1.5"/><rect x="-4" y="38" width="8" height="3" rx="1.5"/><rect x="-4" y="52" width="8" height="3" rx="1.5"/><rect x="-4" y="66" width="8" height="3" rx="1.5"/><rect x="-4" y="80" width="8" height="3" rx="1.5"/><rect x="-4" y="94" width="8" height="3" rx="1.5"/><rect x="-4" y="108" width="8" height="3" rx="1.5"/><rect x="-4" y="122" width="8" height="3" rx="1.5"/>
    </g>
    <circle cx="48" cy="65" r="22" fill="#ffffff"/>
    <polygon points="32,50 24,30 42,40" fill="#ffffff"/>
    <polygon points="64,50 72,30 54,40" fill="#ffffff"/>
    <circle cx="40" cy="64" r="3" fill="#0f172a"/><circle cx="56" cy="64" r="3" fill="#0f172a"/>
  </g>

  <!-- Notebook 2 (Back right, tilted 6deg) -->
  <g transform="translate(130, 20) rotate(6)" filter="url(#catstack-shadow)">
    <rect x="0" y="0" width="105" height="145" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7">
      <rect x="-4" y="10" width="8" height="3" rx="1.5"/><rect x="-4" y="25" width="8" height="3" rx="1.5"/><rect x="-4" y="40" width="8" height="3" rx="1.5"/><rect x="-4" y="55" width="8" height="3" rx="1.5"/><rect x="-4" y="70" width="8" height="3" rx="1.5"/><rect x="-4" y="85" width="8" height="3" rx="1.5"/><rect x="-4" y="100" width="8" height="3" rx="1.5"/><rect x="-4" y="115" width="8" height="3" rx="1.5"/><rect x="-4" y="130" width="8" height="3" rx="1.5"/>
    </g>
    <circle cx="54" cy="70" r="24" fill="#ffffff"/>
    <polygon points="36,54 28,34 46,44" fill="#ffffff"/>
    <polygon points="72,54 80,34 62,44" fill="#ffffff"/>
    <circle cx="46" cy="68" r="3.5" fill="#0f172a"/><circle cx="62" cy="68" r="3.5" fill="#0f172a"/>
    <text x="54" y="115" font-family="sans-serif" font-size="9" font-weight="900" fill="#0369a1" text-anchor="middle">SWEET CAT</text>
  </g>

  <!-- Notebook 1 (Front center, straight) -->
  <g transform="translate(85, 35)" filter="url(#catstack-shadow)">
    <rect x="0" y="0" width="105" height="150" rx="9" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8">
      <rect x="-4" y="12" width="9" height="3.5" rx="1.7"/><rect x="-4" y="28" width="9" height="3.5" rx="1.7"/><rect x="-4" y="44" width="9" height="3.5" rx="1.7"/><rect x="-4" y="60" width="9" height="3.5" rx="1.7"/><rect x="-4" y="76" width="9" height="3.5" rx="1.7"/><rect x="-4" y="92" width="9" height="3.5" rx="1.7"/><rect x="-4" y="108" width="9" height="3.5" rx="1.7"/><rect x="-4" y="124" width="9" height="3.5" rx="1.7"/><rect x="-4" y="138" width="9" height="3.5" rx="1.7"/>
    </g>
    <circle cx="54" cy="75" r="26" fill="#ffffff"/>
    <polygon points="34,58 26,38 45,47" fill="#ffffff"/>
    <polygon points="74,58 82,38 63,47" fill="#ffffff"/>
    <circle cx="44" cy="72" r="3.5" fill="#0f172a"/><circle cx="64" cy="72" r="3.5" fill="#0f172a"/>
    <ellipse cx="37" cy="80" rx="4" ry="2.5" fill="#fb7185" opacity="0.4"/>
    <ellipse cx="71" cy="80" rx="4" ry="2.5" fill="#fb7185" opacity="0.4"/>
