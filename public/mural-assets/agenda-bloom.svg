<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bloom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="45%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <filter id="bloom-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#4a154b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Cover Base -->
  <rect x="25" y="10" width="265" height="380" rx="14" fill="url(#bloom-bg)" filter="url(#bloom-shadow)" stroke="#e9d5ff" stroke-width="2"/>

  <!-- Botanical Leaves Pattern -->
  <g opacity="0.8">
    <!-- Lavender & Purple Botanical Sprigs -->
    <path d="M70 120 C 110 90, 140 140, 190 110" stroke="#a855f7" stroke-width="3" fill="none"/>
    <path d="M100 100 Q 120 75 140 95 Q 125 115 100 100" fill="#c084fc"/>
    <path d="M130 125 Q 155 105 170 125 Q 150 145 130 125" fill="#d8b4fe"/>
    <path d="M80 135 Q 95 160 115 145 Q 100 125 80 135" fill="#e879f9"/>

    <!-- Soft Magenta Leaves on Bottom Right -->
    <path d="M130 260 C 170 230, 210 290, 260 250" stroke="#c026d3" stroke-width="3" fill="none"/>
    <path d="M160 240 Q 185 215 200 235 Q 180 255 160 240" fill="#e879f9"/>
    <path d="M190 270 Q 220 250 235 270 Q 210 290 190 270" fill="#f472b6"/>
    <path d="M225 245 Q 245 220 260 240 Q 240 260 225 245" fill="#fbcfe8"/>

    <!-- Soft Floral Petals Top Right -->
    <circle cx="230" cy="80" r="38" fill="#f472b6" opacity="0.65"/>
    <circle cx="205" cy="65" r="22" fill="#fbcfe8" opacity="0.7"/>
    <circle cx="255" cy="65" r="22" fill="#fbcfe8" opacity="0.7"/>
    <circle cx="230" cy="80" r="10" fill="#fde047"/>
  </g>

  <!-- Title Center Tag/Plaque -->
  <g filter="url(#bloom-shadow)">
    <rect x="75" y="150" width="130" height="50" rx="6" fill="#ffffff" fill-opacity="0.92" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="140" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#6b21a8" text-anchor="middle" letter-spacing="1">AGENDA</text>
    <text x="140" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9333ea" text-anchor="middle" letter-spacing="2">2027</text>
  </g>

  <!-- Elastic Band on Right Edge -->
  <rect x="256" y="10" width="12" height="380" rx="2" fill="#2d1b4e" opacity="0.85"/>

  <!-- Black Wire-o Spiral Binding on Left -->
  <g fill="#18181b">
    <rect x="18" y="24" width="16" height="6" rx="3"/>
    <rect x="18" y="44" width="16" height="6" rx="3"/>
    <rect x="18" y="64" width="16" height="6" rx="3"/>
    <rect x="18" y="84" width="16" height="6" rx="3"/>
    <rect x="18" y="104" width="16" height="6" rx="3"/>
    <rect x="18" y="124" width="16" height="6" rx="3"/>
    <rect x="18" y="144" width="16" height="6" rx="3"/>
    <rect x="18" y="164" width="16" height="6" rx="3"/>
    <rect x="18" y="184" width="16" height="6" rx="3"/>
    <rect x="18" y="204" width="16" height="6" rx="3"/>
    <rect x="18" y="224" width="16" height="6" rx="3"/>
    <rect x="18" y="244" width="16" height="6" rx="3"/>
    <rect x="18" y="264" width="16" height="6" rx="3"/>
    <rect x="18" y="284" width="16" height="6" rx="3"/>
    <rect x="18" y="304" width="16" height="6" rx="3"/>
    <rect x="18" y="324" width="16" height="6" rx="3"/>
    <rect x="18" y="344" width="16" height="6" rx="3"/>
    <rect x="18" y="364" width="16" height="6" rx="3"/>
  </g>
</svg>
