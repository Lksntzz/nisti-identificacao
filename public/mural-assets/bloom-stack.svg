<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <defs>
    <filter id="stack-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-2" dy="5" stdDeviation="5" flood-color="#3b0764" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Notebook 3 (Back left, tilted -7deg) -->
  <g transform="translate(45, 25) rotate(-7)" filter="url(#stack-shadow)">
    <rect x="0" y="0" width="95" height="135" rx="8" fill="#e9d5ff" stroke="#c084fc" stroke-width="1.5"/>
    <!-- Wire-o -->
    <g fill="#18181b">
      <rect x="-4" y="10" width="8" height="3" rx="1.5"/><rect x="-4" y="24" width="8" height="3" rx="1.5"/><rect x="-4" y="38" width="8" height="3" rx="1.5"/><rect x="-4" y="52" width="8" height="3" rx="1.5"/><rect x="-4" y="66" width="8" height="3" rx="1.5"/><rect x="-4" y="80" width="8" height="3" rx="1.5"/><rect x="-4" y="94" width="8" height="3" rx="1.5"/><rect x="-4" y="108" width="8" height="3" rx="1.5"/><rect x="-4" y="122" width="8" height="3" rx="1.5"/>
    </g>
    <!-- Pattern -->
    <circle cx="50" cy="45" r="22" fill="#f472b6" opacity="0.6"/>
    <text x="48" y="95" font-family="sans-serif" font-size="8" font-weight="800" fill="#6b21a8" text-anchor="middle">BLOOM</text>
  </g>

  <!-- Notebook 2 (Back right, tilted 6deg) -->
  <g transform="translate(130, 20) rotate(6)" filter="url(#stack-shadow)">
    <rect x="0" y="0" width="105" height="145" rx="8" fill="#fce7f3" stroke="#f472b6" stroke-width="1.5"/>
    <!-- Wire-o -->
    <g fill="#18181b">
      <rect x="-4" y="10" width="8" height="3" rx="1.5"/><rect x="-4" y="25" width="8" height="3" rx="1.5"/><rect x="-4" y="40" width="8" height="3" rx="1.5"/><rect x="-4" y="55" width="8" height="3" rx="1.5"/><rect x="-4" y="70" width="8" height="3" rx="1.5"/><rect x="-4" y="85" width="8" height="3" rx="1.5"/><rect x="-4" y="100" width="8" height="3" rx="1.5"/><rect x="-4" y="115" width="8" height="3" rx="1.5"/><rect x="-4" y="130" width="8" height="3" rx="1.5"/>
    </g>
    <!-- Big flower -->
    <circle cx="65" cy="65" r="30" fill="#f472b6" opacity="0.7"/>
    <circle cx="65" cy="65" r="8" fill="#fef08a"/>
    <text x="52" y="118" font-family="sans-serif" font-size="10" font-weight="900" fill="#9d174d" text-anchor="middle">2027</text>
  </g>

  <!-- Notebook 1 (Front center, straight) -->
  <g transform="translate(85, 35)" filter="url(#stack-shadow)">
    <rect x="0" y="0" width="105" height="150" rx="9" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <!-- Wire-o -->
    <g fill="#18181b">
      <rect x="-4" y="12" width="9" height="3.5" rx="1.7"/><rect x="-4" y="28" width="9" height="3.5" rx="1.7"/><rect x="-4" y="44" width="9" height="3.5" rx="1.7"/><rect x="-4" y="60" width="9" height="3.5" rx="1.7"/><rect x="-4" y="76" width="9" height="3.5" rx="1.7"/><rect x="-4" y="92" width="9" height="3.5" rx="1.7"/><rect x="-4" y="108" width="9" height="3.5" rx="1.7"/><rect x="-4" y="124" width="9" height="3.5" rx="1.7"/><rect x="-4" y="138" width="9" height="3.5" rx="1.7"/>
    </g>
    <!-- Botanical pattern -->
    <circle cx="58" cy="55" r="26" fill="#c084fc" opacity="0.6"/>
    <circle cx="75" cy="70" r="18" fill="#f472b6" opacity="0.6"/>
    <circle cx="58" cy="55" r="8" fill="#fde047"/>
    <rect x="25" y="90" width="56" height="24" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#e9d5ff"/>
    <text x="53" y="102" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#6b21a8" text-anchor="middle">BLOOM</text>
    <text x="53" y="111" font-family="sans-serif" font-size="6.5" font-weight="600" fill="#9333ea" text-anchor="middle">2027</text>
  </g>
</svg>
