name = "nisti-identificacao"
account_id = "c36bf07704c2dc29e76e03539127ba05"
main = "src/operator-audit-router.js"
compatibility_date = "2026-08-17"
compatibility_flags = [ "nodejs_compat" ]
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "nisti-identificacao"
database_id = "10181c7e-ffdc-41d5-a40e-802173da9a02"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "nisti-identificacao-images"

[ai]
binding = "AI"

[[vectorize]]
binding = "COVER_VECTORS"
index_name = "nisti-cover-embeddings"

[secrets]
required = [ "SUPABASE_SERVICE_ROLE_KEY" ]

[vars]
APP_ENV = "preview"
COMMERCE_DATA_SCOPE = "preview"
COMMERCE_COMMIT_ENABLED = "1"
SUPABASE_URL = "https://yioetdcbgorunwgwuawg.supabase.co"
SUPABASE_READS_ENABLED = "0"
SUPABASE_READ_TIMEOUT_MS = "5000"
SUPABASE_WRITE_MODE = "off"
SUPABASE_CUTOVER_WRITE_FREEZE = "0"
AI_VISION_MODEL = "@cf/moondream/moondream3.1-9B-A2B"
GEMINI_IMAGE_MODEL = "gemini-3.5-flash"
GEMINI_IMAGE_FALLBACK_MODEL = "gemini-3.1-flash-lite"
