name = "nisti-identificacao"
account_id = "c36bf07704c2dc29e76e03539127ba05"
main = "src/operator-audit-router.js"
compatibility_date = "2026-08-17"
compatibility_flags = [ "nodejs_compat" ]
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "nisti-identificacao"
database_id = "10181c7e-ffdc-41d5-a40e-802173da9a02"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "nisti-identificacao-images"

[[vectorize]]
binding = "COVER_VECTORS"
index_name = "nisti-cover-embeddings"

[vars]
APP_ENV = "preview"
COMMERCE_COMMIT_ENABLED = "0"
GEMINI_VERIFIER_MODEL = "gemini-3.7-flash"
GEMINI_MODEL = "gemini-3.6-flash"
GEMINI_DETAIL_MODEL = "gemini-3.6-flash"
GEMINI_EMBEDDING_MODEL = "gemini-embedding-2"
RETRIEVAL_FASTPATH_MIN_SCORE = "0.920"
RETRIEVAL_FASTPATH_MIN_MARGIN = "0.008"
SUPABASE_URL = "https://yioetdcbgorunwgwuawg.supabase.co"
SUPABASE_READS_ENABLED = "0"
SUPABASE_READ_TIMEOUT_MS = "2500"
SUPABASE_WRITE_MODE = "off"
SUPABASE_CUTOVER_WRITE_FREEZE = "0"
