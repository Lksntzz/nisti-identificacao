name = "nisti-identificacao"
main = "src/worker.js"
compatibility_date = "2026-08-17"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "nisti-identificacao"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "nisti-identificacao-images"

[vars]
APP_ENV = "production"
GEMINI_MODEL = "gemini-3.5-flash"
