name = "nisti-identificacao"
main = "src/operator-audit-router.js"
compatibility_date = "2026-08-17"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Logs do Worker (plano gratuito: 200 mil eventos/dia, 3 dias). Sem logs de cada pedido:
# só o que o código escreve (ex.: avisos de 429), para não gastar a cota.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "nisti-identificacao-images"


[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "419001"
simple.limit = 1200
simple.period = 60

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "419002"
simple.limit = 10
simple.period = 60

[[ratelimits]]
name = "DISPATCH_POLL_RATE_LIMITER"
namespace_id = "419004"
simple.limit = 300
simple.period = 60

[[ratelimits]]
name = "CANVA_ART_RATE_LIMITER"
namespace_id = "419003"
simple.limit = 6
simple.period = 60




[vars]
APP_ENV = "production"
COMMERCE_DATA_SCOPE = "live"
# Somente o SHA-256 do token aleatorio de 256 bits; jamais adicionar o token ao repositorio.
DISPATCH_SENDER_TOKEN_SHA256 = "943d6e3f2c36d7e37c8f6aa9cbad1ba9cc17f9309945bb535f6f169b278fdf04"
COMMERCE_COMMIT_ENABLED = "1"
SUPABASE_URL = "https://yioetdcbgorunwgwuawg.supabase.co"
SUPABASE_READS_ENABLED = "1"
# GA-P02B (TEMPORARIO, medicao): fila da Visao estrategica. Remover para voltar ao padrao 3.
GA_STRATEGIC_PARALLEL = "2"
SUPABASE_READ_TIMEOUT_MS = "5000"
SUPABASE_WRITE_MODE = "primary"
SUPABASE_CUTOVER_WRITE_FREEZE = "0"


[triggers]
crons = ["*/5 * * * *"]
