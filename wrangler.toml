name = "nisti-identificacao"
main = "src/operator-audit-router.js"
compatibility_date = "2026-08-17"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "nisti-identificacao-images"


[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "419001"
simple.limit = 120
simple.period = 60

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "419002"
simple.limit = 10
simple.period = 60

[[ratelimits]]
name = "CANVA_ART_RATE_LIMITER"
namespace_id = "419003"
simple.limit = 6
simple.period = 60




[vars]
APP_ENV = "production"
COMMERCE_DATA_SCOPE = "live"
# Somente o SHA-256 do token aleatorio de 256 bits; jamais adicionar o token ao repositorio.
DISPATCH_SENDER_TOKEN_SHA256 = "9e91bda228a84f35b0f3441e368559532ad2ff2f9ad04671df3e79c952a310fd"
COMMERCE_COMMIT_ENABLED = "1"
SUPABASE_URL = "https://yioetdcbgorunwgwuawg.supabase.co"
SUPABASE_READS_ENABLED = "1"
SUPABASE_READ_TIMEOUT_MS = "5000"
SUPABASE_WRITE_MODE = "primary"
SUPABASE_CUTOVER_WRITE_FREEZE = "0"


[triggers]
crons = ["*/5 * * * *"]
