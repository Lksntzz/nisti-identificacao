name = "nisti-identificacao"
main = "src/operator-audit-router.js"
compatibility_date = "2026-08-17"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "nisti-identificacao-images"


[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = 419001
simple.limit = 120
simple.period = 60

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = 419002
simple.limit = 10
simple.period = 60




[vars]
APP_ENV = "production"
COMMERCE_DATA_SCOPE = "live"
COMMERCE_COMMIT_ENABLED = "1"
SUPABASE_URL = "https://yioetdcbgorunwgwuawg.supabase.co"
SUPABASE_READS_ENABLED = "1"
SUPABASE_READ_TIMEOUT_MS = "5000"
SUPABASE_WRITE_MODE = "primary"
SUPABASE_CUTOVER_WRITE_FREEZE = "0"


[triggers]
crons = ["*/30 * * * *"]
